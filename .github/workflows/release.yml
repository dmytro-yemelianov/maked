name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    # Everything cross-compiles on the raps-ci Linux x64 box: GitHub-hosted
    # macOS/Windows images are billing-blocked for this account.
    runs-on: [self-hosted, raps-ci, maked]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - universal2-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and package
        run: scripts/ci/package.sh "${{ matrix.target }}" "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: maked-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bench:
    name: Benchmark the Linux binaries against GNU make
    # Tests run the binary cargo builds; this runs the ones that ship. The
    # v0.2.1 musl binary was 4x slower than GNU make on git and nothing
    # noticed. glibc builds must stay within 2x; musl is documented slower
    # and only warns.
    needs: [build]
    runs-on: [self-hosted, raps-ci, maked]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: maked-x86_64-unknown-linux-*
          path: bench-artifacts
      - name: Null build vs GNU make
        run: |
          set -euo pipefail
          for a in bench-artifacts/*/*.tar.gz; do tar -xzf "$a" -C bench-artifacts; done
          python3 benchmarks/release/artifact_bench.py --warn-only '*musl*' bench-artifacts/maked-*/maked

  release:
    name: Publish GitHub Release
    needs: [build, bench]
    runs-on: [self-hosted, raps-ci, maked]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Collect bundles and SHA256SUMS
        run: |
          set -euo pipefail
          rm -rf release-dist && mkdir release-dist
          find raw-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS
          ls -lh && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
